[package]
name = "ksnake-x11-control"
version = "1.0.0"
description = "Software de configuracao e backup para o mouse K-Snake X11"
authors = ["User"]
edition = "2021"

[lib]
name = "ksnake_x11_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
